  score: sum_probability_before_true_rank_plus_U_times_true_rank_probability
  randomization:
    namespace: SHIFT_SLEEP_UQ_RAPSENS_V1
    global_seed: 2031
    key_fields: [namespace, global_seed, direction, model_family, model_seed, split, subject_id, recording_id, epoch_index, purpose]
