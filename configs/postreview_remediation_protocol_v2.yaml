r3:
  id: SEQSLEEPNET_CLASS_L20_V1
  role: CONFIRMATORY_GENERALIZATION
  paper: Phan et al. 2019 SeqSleepNet
  paper_doi: 10.1109/TNSRE.2019.2896659
  source_repository: https://github.com/pquochuy/SeqSleepNet
  source_commit_observed: f8a5fd039e9511bfd5573e6cc684d8e9bfd2fab9
  source_access_date: 2026-09-22
  source_runtime_dependency: false
  local_module: src/shiftsleep_uq/models/seqsleepnet_class.py
  local_module_hash: f1e6b3f0f105ec2b002d6d80f3d8eafc0f665ebae12635f66b41c90b3aee7894
  variants: [S0, S1]
  directions: [D1_SLEEPEDF_TO_ISRUC, D2_ISRUC_TO_SLEEPEDF]
  conditions: [C0, C1, C2, C3, C4, C5]
  seeds: [17, 42, 2026]
  input: {channels: [EEG, EOG], eeg_hz: 100, eog_input_hz: 50, eog_aligned_hz: 100, eog_resample: scipy.signal.resample_poly, eog_up: 2, eog_down: 1, epochs_seconds: 30}
  spectrogram:
    stft_window_samples: 200
    overlap: 0.5
    hop_samples: 100
    window: Hamming
    nfft: 256
    one_sided_bins: 129
    frames: 29
    power: abs_stft_squared
    log: ln_power_plus_1e-8
  normalization: {fit_scope: SOURCE_TRAIN_ONLY, unit: modality_x_frequency_bin, aggregate: retained_epochs_x_29_frames, epsilon: 1.0e-6}
  filterbank:
    support: linear_frequency_triangular
    reference_file: tensorflow_net/SeqSleepNet/filterbank_shape.py@f8a5fd039e9511bfd5573e6cc684d8e9bfd2fab9
    support_function: lin_tri_filter_shape
    support_dimensions: {F: 129, M: 32, nfft: 256, samplerate: 100, lowfreq: 0, highfreq: 50}
    local_unit_tolerance: 1.0e-7
    trainable_transform: sigmoid(W_c)*T
    W_shape: [129, 32]
  gating: after_filterbank_before_channel_concatenation
  epoch_encoder: {type: bidirectional_GRU, input: 64, hidden_per_direction: 64, output: 128, projection: [128, 64], attention: 64, attention_axis: 29}
  sequence_encoder: {length: 20, type: bidirectional_GRU, input: 64, hidden_per_direction: 64, output: 128, classifier: [128, 5]}
  regularization: {dropout: 0.25, weight_decay: 0.001, recurrent_batch_norm: false}
  sequences:
    train: {length: 20, stride: 10, complete_only: true, no_padding: true}
    evaluation: {length: 20, stride: 1, complete_only: true, no_padding: true, aggregate: mean_raw_logits_per_epoch}
    boundary: recording_subject_contiguous_original_epoch_indices
    excluded_gap_terminates_segment: true
    short_segment_policy: exclude_and_report_warning_if_over_1_percent
  exposure:
    S0: {FULL: 1.0, EEG_ONLY: 0.0, EOG_ONLY: 0.0}
    S1: {FULL: 0.50, EEG_ONLY: 0.25, EOG_ONLY: 0.25}
    seed: 2029
    key_fields: [direction, model_seed, training_epoch, subject_id, recording_id, sequence_start_index]
    order_independent: true
  training: {loss: mean_cross_entropy_over_20_labels, optimizer: Adam, learning_rate: 0.0001, weight_decay: 0.001, batch_size: 32, epochs: 10, precision: FP32, scheduler: NONE, gradient_clip_global_norm: 1.0}
  checkpoint_selection: {population: SOURCE_DEV, mask: FULL, hierarchy: [highest_macro_f1, lowest_nll_on_tie, earliest_epoch], evaluate_every_epoch: true, all_epochs_required: true}
  fallback: {primary_batch_size: 32, fallback_batch_size: 16, fallback_accumulation: 2, second_fallback_batch_size: 8, second_fallback_accumulation: 4, precision_change: FORBIDDEN, sequence_change: FORBIDDEN, hidden_size_change: FORBIDDEN, if_batch8_oom: R3_HARDWARE_BLOCKED}
  determinism: {python: true, numpy: true, torch_cpu: true, torch_cuda: true, deterministic_algorithms: true, cudnn_benchmark: false}
  calibration: {temperature: SOURCE_CAL_ONLY_HISTORICAL_ROUTINE, conformal: R1_RANDOMIZED_APS, ranking: uncalibrated_entropy}
  primary_cells: [D1_C4, D1_C5, D2_C4, D2_C5]
