contract_version: "1.2.0"
freeze_date: "2026-09-01"
research_commit: "PENDING_STEP5_1_COMMIT"
status: CORE_PREPROCESSING_FROZEN
final_benchmark_frozen: false
freeze_levels:
  CORE_PREPROCESSING_FROZEN: "Sleep-EDF SC and ISRUC-S1 have verified identity, exact source derivations or frozen source-supported channel-family roles, labels, scorer, epoch, missingness, and sampling contracts; deterministic preprocessing may be implemented, but not executed by this step."
  FINAL_BENCHMARK_FROZEN: "All intended primary domains, including SHHS1, are acquired and every record passes schema validation."
canonical_labels: [Wake, N1, N2, N3, REM]
label_mappings:
  Wake: ["Sleep stage W", "W", "Wake"]
  N1: ["Sleep stage 1", "Sleep stage N1", "Stage 1", "N1"]
  N2: ["Sleep stage 2", "Sleep stage N2", "Stage 2", "N2"]
  N3: ["Sleep stage 3", "Sleep stage 4", "Sleep stage N3", "Stage 3", "Stage 4", "N3"]
  REM: ["Sleep stage R", "REM", "Stage R"]
excluded_annotations:
  - "Movement time"
  - "Sleep stage U"
  - "Sleep stage ?"
  - "unknown"
  - "unscored"
  - "artifact"
  - "corrupt_annotation"
  - "incomplete_epoch"
  - "epoch_without_matching_signal_samples"
primary_exclusion_policy: "Exclude only invalid/unscored/non-stage/alignment-failure epochs listed above; do not exclude valid Wake, transitions, or scorer-2 disagreement when scorer-1 is primary."
epoch_duration_seconds: 30
wake_policy:
  primary: preserve_all_valid_scored_epochs_including_wake
  label_derived_trimming: secondary_only
scorer_policy:
  isruc_primary: "scorer_1"
  isruc_secondary: "scorer_2"
  primary_selection_basis: "NEMAR v1.0.1 README states events are generated from scorer-1 Excel files and scorer-2 labels are retained in annotation extras; scorer choice is predeclared and not performance-selected."
  disagreement_is_primary_exclusion: false
  consensus_only: secondary_sensitivity_only
  diagnostics: [agreement_rate, cohen_kappa, stage_specific_disagreement, confidence_by_agreement, error_by_agreement]

datasets:
  - dataset_id: sleep_edf_sc
    version: "1.0.0"
    role: PRIMARY_ACCESSIBLE_CORE
    cohorts: [SC]
    subject_key_rule: "SC filename subject token; all available nights grouped by participant"
    repeat_group_rule: "subject_id; nights cannot cross partitions"
    selected_modalities: [EEG, EOG]
    selected_channels:
      EEG: {channel: "EEG Fpz-Cz", reference: "Cz in source derivation label", native_rate_hz: 100}
      EOG: {channel: "EOG horizontal", reference: "source derivation label retained", native_rate_hz: 100}
    channel_fallbacks: none
    native_rates: {EEG: 100, EOG: 100}
    access_state: RAW_ACCESS_APPROVED
    annotation_source: "official Sleep-EDF hypnogram EDF+ annotations"
    scorer_policy: single_official_annotation_stream
  - dataset_id: isruc_s1
    version: "1.0.1"
    role: PRIMARY_ACCESSIBLE_CORE
    cohorts: [ISRUC-S1]
    subject_key_rule: "NEMAR participant_id sub-I###; one recording per participant"
    repeat_group_rule: "participant_id; no subject may cross partitions"
    selected_modalities: [EEG, EOG]
    selected_channels:
      EEG: {role: "LEFT_CENTRAL_EEG", accepted_exact_derivations: ["C3-A2", "C3-M2"], native_rate_hz: 200}
      EOG: {role: "LEFT_OCULAR_EOG", accepted_exact_derivations: ["LOC-A2", "E1-M2"], native_rate_hz: 200}
    channel_fallbacks: none
    exact_derivation_allowlist:
      - {eeg: "C3-A2", eog: "LOC-A2", montage_variant: "ISRUC_A1A2"}
      - {eeg: "C3-M2", eog: "E1-M2", montage_variant: "ISRUC_M1M2"}
    derivation_identity_policy: "Retain exact source derivations; no renaming, aliasing, re-referencing, numerical-equivalence claim, or fuzzy matching."
    mandatory_metadata: [source_eeg_derivation, source_eog_derivation, eeg_anatomical_role, eog_anatomical_role, montage_variant]
    montage_sensitivity_strata: [ISRUC_A1A2, ISRUC_M1M2]
    native_rates: {EEG: 200, EOG: 200}
    access_state: PUBLIC_METADATA_VERIFIED
    annotation_source: "NEMAR v1.0.1 scorer-1 events derived from original ISRUC scorer-1 Excel files; scorer-2 retained as extras"
    scorer_policy: "scorer_1 primary; scorer_2 secondary diagnostic"
  - dataset_id: sleep_edf_st
    version: "1.0.0"
    role: SECONDARY_STRESS_DOMAIN
    cohorts: [ST]
    subject_key_rule: "ST filename subject token; both treatment nights grouped by participant"
    repeat_group_rule: "subject_id; placebo and temazepam nights cannot cross partitions"
    selected_modalities: [EEG, EOG]
    selected_channels:
      EEG: {channel: "EEG Fpz-Cz", reference: "Cz in source derivation label", native_rate_hz: 100}
      EOG: {channel: "EOG horizontal", reference: "source derivation label retained", native_rate_hz: 100}
    channel_fallbacks: none
    native_rates: {EEG: 100, EOG: 100}
    access_state: RAW_ACCESS_APPROVED
    annotation_source: "official Sleep-EDF hypnogram EDF+ annotations"
    scorer_policy: single_official_annotation_stream
  - dataset_id: isruc_s2_s3
    version: "1.0.1"
    role: SECONDARY_SENSITIVITY_DOMAIN
    cohorts: [ISRUC-S2, ISRUC-S3]
    subject_key_rule: "NEMAR participant_id preserves subgroup and subject number"
    repeat_group_rule: "participant_id; all ISRUC-S2 sessions remain together"
    selected_modalities: [EEG, EOG]
    selected_channels: {EEG: "not primary-frozen; S2 session-2 representative uses F3-M2/C3-M2 montage", EOG: "not primary-frozen"}
    channel_fallbacks: none
    native_rates: {documented: 200, verified_representative: 200}
    access_state: PUBLIC_METADATA_VERIFIED
    annotation_source: "NEMAR scorer-1 events with scorer-2 extras where present"
    scorer_policy: "scorer_1 primary for secondary analyses; exact channel contract must be separately declared"
  - dataset_id: shhs1
    version: "public NSRR schema"
    role: PLANNED_PRIMARY_DOMAIN_PENDING_RAW_ACCESS
    cohorts: [SHHS1]
    subject_key_rule: "NSRR participant identifier"
    repeat_group_rule: "all visits for participant remain together"
    selected_modalities: [EEG, EOG]
    selected_channels:
      EEG: {channel: "C3-A2", reference: A2, nominal_rate_hz: 125}
      EOG: {channel: "EOG(L)-PG1", reference: PG1, nominal_rate_hz: 50}
    channel_fallbacks: "none; per-record validation required; quarantine if exact channels/rates are unavailable"
    native_rates: {EEG: 125, EOG: 50}
    access_state: RAW_ACCESS_PENDING
    annotation_source: "official NSRR XML; primary XML stream to be frozen after authorized audit"
    scorer_policy: "pending authorized raw/XML audit"
  - dataset_id: capslpdb
    version: "1.0.0"
    role: EXTERNAL_STRESS_DOMAIN
    cohorts: [CAP]
    subject_key_rule: "unresolved; no subject-level inferential use"
    repeat_group_rule: unresolved
    selected_modalities: [EEG, EOG]
    selected_channels: unresolved
    channel_fallbacks: none
    native_rates: unresolved
    access_state: PUBLIC_METADATA_PARTIAL
    annotation_source: unresolved
    scorer_policy: unresolved

modalities:
  EEG: {status: PRIMARY}
  EOG: {status: PRIMARY}
  EMG: {status: SECONDARY_COMPATIBLE_SUBSET_ONLY, rationale: "Sleep-EDF SC is a processed 1-Hz RMS envelope while ISRUC/SHHS EMG representations differ; no primary equivalence"}
resampling_policy:
  step5_1: none_performed
  target_rates: {EEG: 100, EOG: 50}
  rationale: "EEG only downsampling for ISRUC/SHHS; EOG downsampling for ISRUC and none for SHHS nominal; no modality upsampling"
  step6_requirement: "Specify deterministic anti-aliasing before any downsampling and validate every native rate per record"
synthetic_missingness_conditions:
  semantics: "raw modality exists but is intentionally unavailable at condition time"
  representation: "explicit modality-availability mask; missing signal representation must be non-confusable with physiological zero"
  allowed_primary: [C0_all_present, C1_no_EOG, C2_no_EEG, C3_unseen_all_present, C4_unseen_no_EOG, C5_unseen_no_EEG]
  forbidden: [no_EEG_EOG]
structural_mismatch_policy:
  separate_from_synthetic_masking: true
  cases: [required_modality_not_acquired, required_channel_unavailable, incompatible_EMG_representation, corrupt_required_channel, unexpected_native_rate]
  disposition: "quarantine/exclude exact-channel record or report as separate structural stress condition; never relabel as synthetic mask"
shift_taxonomy:
  C0: known_domain_EEG_EOG
  C1: known_domain_EEG_only_synthetic_no_EOG
  C2: known_domain_EOG_only_synthetic_no_EEG
  C3: unseen_domain_EEG_EOG
  C4: unseen_domain_EEG_only_synthetic_no_EOG
  C5: unseen_domain_EOG_only_synthetic_no_EEG
  structural: separate_structural_channel_mismatch_conditions

target_free_rules:
  source_calibration_subjects_disjoint_from: [source_train, source_dev, model_selection]
  held_out_target_allowed_before_evaluation: false
  forbidden_target_uses: [normalization_fit, temperature_fit, calibrator_fit, abstention_threshold, conformal_calibration, checkpoint_selection, hyperparameters, channel_selection]
  oracle_target_calibration: separate_upper_bound_only
split_rules:
  unit: subject
  sleep_edf_sc: all_nights_together
  isruc_s1: one_recording_per_subject
  sleep_edf_st: both_treatment_nights_together
  isruc_s2: all_sessions_together
  shhs: all_visits_together
  cap: no_subject_level_inference_until_identity_resolved
schema_acceptance_rules:
  raw_immutable: true
  per_record_header_validation_required: true
  required_primary_modalities: [EEG, EOG]
  required_annotation_epoch_seconds: 30
  reject_on: [ambiguous_subject_identity, unresolved_required_channel, unexplained_annotation_semantics, signal_annotation_duration_mismatch, unsupported_fallback]
  accessible_core_requires: [sleep_edf_sc_exact_channels, isruc_s1_source_supported_channel_family, isruc_s1_scorer_1]
  planned_domain_cannot_masquerade_as_acquired: true
unresolved_optional_items:
  - SHHS1 authorized raw/XML access and per-record deviations
  - SHHS1 primary XML stream after access audit
  - ISRUC secondary S2/S3 exact channel contract
  - CAP identity and full schema
  - exact secondary EMG compatible subset
  - final split membership and deterministic subset size
