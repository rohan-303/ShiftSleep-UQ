    alpha_excluded_from_key: true
    hash: SHA256_UTF8_UNIT_SEPARATOR
    float_conversion: first_53_bits_of_first_8_big_endian_bytes_divided_by_2^53
  calibration_quantile:
    k: ceil((n+1)*(1-alpha))
    clamp: [1,n]
    order_statistic: sorted_scores[k-1]
    interpolation: NONE
  prediction_set:
    boundary: first_cumulative_probability_ge_q_alpha
    inclusion_probability: clip((q_alpha-cumulative_before_boundary)/boundary_probability,0,1)
    include_boundary_if: U_pred_leq_inclusion_probability
